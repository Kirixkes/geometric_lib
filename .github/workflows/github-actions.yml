name: github-actions

on:
  push:
    branches:
      - feat/tests
  pull_request:
    branches:
      - feat/tests
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Print User Info
        run: |
          echo "ФИО: Алпатов Кирилл Олегович"
          echo "Номер группы: M3114"
          echo "Github : Kirixkes"

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
      - name: Check code style with flake8
        run: |
          pip install flake8
          flake8 .

      - name: List root directory
        run: |
          ls -R

      - name: List directory in $GITHUB_WORKSPACE
        run: |
          ls -R $GITHUB_WORKSPACE

      - name: List all files including hidden
        run: |
          ls -la

      - name: Show Git status
        run: |
          git status    
          
      - name: Starting Tests
        run: |
          cd $GITHUB_WORKSPACE
          python -m unittest discover -s tests -v
